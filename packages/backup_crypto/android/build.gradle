group = 'com.demizo.daily_you.backup_crypto'
version = '1.0'

apply plugin: 'com.android.library'

if (project.findProperty("android.builtInKotlin")?.toString() != "true") {
    apply plugin: "kotlin-android"
}

android {
    namespace = 'com.demizo.daily_you.backup_crypto'
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion 24
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}

// Keep Kotlin bytecode compatible with Java 17 regardless of the host JDK.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
}
